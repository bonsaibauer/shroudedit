[workspace]
resolver = "2"
members = [
  "apps/labrinth",
  "packages/ariadne",
  "packages/component-derive",
  "packages/neverbounce",
  "packages/path-util",
  "packages/serde-binhum",
  "packages/shroudedit-content-management",
  "packages/shroudedit-log",
  "packages/shroudedit-maxmind",
  "packages/shroudedit-util",
  "packages/xredis",
]

[workspace.package]
edition = "2024"
rust-version = "1.90.0"
repository = "https://github.com/bonsaibauer/shroudedit"

[workspace.dependencies]
actix-cors = "0.7.1"
actix-files = "0.6.8"
actix-http = "3.11.2"
actix-multipart = "0.7.2"
actix-rt = "2.11.0"
actix-web = "4.11.0"
actix-web-prom = "0.10.0"
actix-ws = "0.3.0"
arc-swap = "1.7.1"
argon2 = { version = "0.5.3", features = ["std"] }
ariadne = { path = "packages/ariadne" }
async-stripe = { version = "0.41.0", default-features = false, features = [
  "runtime-tokio-hyper-rustls",
] }
async-trait = "0.1.89"
aws-sdk-s3 = { version = "=1.122.0", default-features = false, features = [
  "default-https-client",
  "rt-tokio",
  "rustls",
] }
base64 = "0.22.1"
bitflags = "2.9.4"
bytes = "1.10.1"
cel = { version = "0.14.0", default-features = false, features = ["json", "regex"] }
censor = "0.3.0"
chrono = "0.4.42"
chumsky = "0.9.3"
clap = "4.5.48"
clickhouse = "0.14.0"
color-eyre = "0.6.5"
color-thief = "0.2.2"
component-derive = { path = "packages/component-derive" }
const_format = "0.2.34"
darling = { version = "0.23" }
dashmap = "6.1.0"
deadpool-redis = "0.23.0"
derive_more = "2.1.1"
dioxus-devtools = "0.7.10"
directories = "6.0.0"
dotenv-build = "0.1.1"
dotenvy = "0.15.7"
either = "1.15.0"
eyre = "0.6.12"
flate2 = "1.1.4"
futures = "0.3.31"
futures-util = "0.3.31"
heck = "0.5.0"
hex = "0.4.3"
hmac = "0.12.1"
hyper-rustls = { version = "0.27.7", default-features = false, features = [
  "aws-lc-rs",
  "http1",
  "native-tokio",
  "tls12",
] }
hyper-util = "0.1.17"
iana-time-zone = "0.1.64"
image = { version = "0.25.8", default-features = false, features = ["rayon"] }
itertools = "0.14.0"
jemalloc_pprof = "0.8.1"
json-patch = { version = "4.1.0", default-features = false }
lettre = { version = "0.11.19", default-features = false, features = [
  "aws-lc-rs",
  "builder",
  "hostname",
  "pool",
  "rustls",
  "rustls-native-certs",
  "smtp-transport",
  "tokio1",
  "tokio1-rustls",
] }
lingua = "=1.8.0"
linkify = "0.11.0"
lz4_flex = { version = "0.11.5", default-features = false, features = [
  "checked-decode",
  "safe-decode",
  "safe-encode",
  "std",
] }
maxminddb = "0.26.0"
muralpay = { path = "packages/muralpay" }
murmur2 = "0.1.0"
neverbounce = { path = "packages/neverbounce" }
paste = "1.0.15"
path-util = { path = "packages/path-util" }
postcard = { version = "1.1.3", default-features = false, features = ["alloc"] }
proc-macro2 = { version = "1.0" }
prometheus = "0.14.0"
psl = "2.1.145"
pulldown-cmark = { version = "0.13.4", default-features = false }
quick-xml = "0.38.3"
quote = { version = "1.0" }
rand = "=0.8.5"  # Locked on 0.8 until argon2 and p256 update to 0.9
rand_chacha = "=0.3.1"  # Locked on 0.3 until we can update rand to 0.9
rdkafka = { version = "0.36.2", features = ["cmake-build"] }
redis = "1.4.1"
regex = "1.12.2"
reqwest = { version = "0.12.24", default-features = false }
rust_decimal = { version = "1.39.0", features = ["serde-with-float", "serde-with-str"] }
rust_iso3166 = "0.1.14"
rustls = "0.23.32"
rustrict = { version = "0.7.39", default-features = false, features = ["censor"] }
rusty-money = "0.4.1"
scalar_api_reference = { version = "0.2.2", default-features = false }
secrecy = "0.10.3"
sentry = { version = "0.45.0", default-features = false, features = [
  "backtrace",
  "contexts",
  "debug-images",
  "panic",
  "reqwest",
  "rustls",
] }
serde = "1.0.228"
serde-binhum = { path = "packages/serde-binhum" }
serde_bytes = "0.11.19"
serde_cbor = "0.11.2"
serde_json = "1.0.145"
serde_with = "3.15.0"
sha1 = "0.10.6"
sha2 = "0.10.9"
shroudedit-content-management = { path = "packages/shroudedit-content-management" }
shroudedit-log = { path = "packages/shroudedit-log" }
shroudedit-util = { path = "packages/shroudedit-util" }
smallvec = "1.15.1"
spdx = "0.12.0"
sqlx = { version = "0.8.6", default-features = false }
sqlx-tracing = { path = "packages/sqlx-tracing" }
strum = "0.27.2"
syn = { version = "2.0" }
tar = "0.4.44"
thiserror = "2.0.17"
tikv-jemalloc-ctl = "0.6.0"
tikv-jemallocator = "0.6.0"
tokio = "1.47.1"
tokio-stream = "0.1.17"
totp-rs = "5.7.0"
tracing = "0.1.41"
tracing-actix-web = { version = "0.7.19", default-features = false }
tracing-ecs = "0.5.0"
tracing-subscriber = "0.3.20"
typed-path = "0.12.0"
unicode-normalization = "0.1.24"
unicode-segmentation = "1.12.0"
url = "2.5.7"
urlencoding = "2.1.3"
utoipa = { version = "5.4.0", features = ["actix_extras", "chrono", "decimal"] }
uuid = "1.18.1"
validator = "0.20.0"
webauthn-rs = "0.5.5"
webauthn-rs-proto = "0.5.5"
webp = { version = "0.3.1", default-features = false }
woothee = "0.13.0"
xredis = { path = "packages/xredis" }
yaserde = "0.12.0"
zip = { version = "6.0.0", default-features = false, features = [
  "bzip2",
  "deflate",
  "deflate64",
  "zstd",
] }
zxcvbn = "3.1.0"

[workspace.lints.clippy]
bool_to_int_with_if = "warn"
borrow_as_ptr = "warn"
cfg_not_test = "warn"
clear_with_drain = "warn"
cloned_instead_of_copied = "warn"
collection_is_never_read = "warn"
dbg_macro = "warn"
default_trait_access = "warn"
explicit_iter_loop = "warn"
filter_map_next = "warn"
flat_map_option = "warn"
format_push_string = "warn"
get_unwrap = "warn"
large_include_file = "warn"
large_stack_arrays = "warn"
manual_assert = "warn"
manual_instant_elapsed = "warn"
manual_is_variant_and = "warn"
manual_let_else = "warn"
map_unwrap_or = "allow"
match_bool = "warn"
needless_collect = "warn"
negative_feature_names = "warn"
non_std_lazy_statics = "warn"
pathbuf_init_then_push = "warn"
read_zero_byte_vec = "warn"
redundant_clone = "warn"
redundant_feature_names = "warn"
redundant_type_annotations = "warn"
result_large_err = "allow"
todo = "warn"
too_many_arguments = "allow"
type_complexity = "allow"
uninlined_format_args = "warn"
unnested_or_patterns = "warn"
wildcard_dependencies = "warn"

[profile.dev.package.sqlx-macros]
opt-level = 3

# Optimize for speed and reduce size on release builds
[profile.release]
opt-level = "s"  # Optimize for binary size
strip = true  # Remove debug symbols
lto = true  # Enables link to optimizations
panic = "abort"  # Strip expensive panic clean-up logic

[profile.test]
inherits = "dev"
debug = "line-tables-only"

# Specific profile for labrinth production builds
[profile.release-labrinth]
inherits = "release"
opt-level = 2
debug = "line-tables-only"  # Minimal debug info
strip = false  # Keep debug symbols for Sentry
lto = "thin"  # Enable LTO but keep compile times reasonable
panic = "unwind"  # Don't exit the whole app on panic in production
