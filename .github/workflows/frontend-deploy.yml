name: Deploy frontend
run-name: Deploy frontend (${{ inputs.channel || 'stable' }}) from ${{ inputs.source_ref || github.ref_name }}

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      channel:
        description: Frontend deployment channel
        type: string
        required: true
      source_sha:
        description: Commit to build and deploy
        type: string
        required: false
      source_ref:
        description: Source branch to deploy
        type: string
        required: false

permissions:
  contents: read
  deployments: write

concurrency:
  group: shroudedit-frontend-${{ inputs.channel || 'stable' }}
  cancel-in-progress: false
  queue: max

jobs:
  deploy:
    name: Build and deploy the selected frontend channel
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      deployments: write
    env:
      DEPLOYMENT_CHANNEL: ${{ inputs.channel || 'stable' }}
      DEPLOY_SOURCE_REF: ${{ inputs.source_ref || github.ref_name }}
      DEPLOY_SHA: ${{ inputs.source_sha || github.sha }}
    steps:
      - name: Check out the selected source commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          fetch-depth: 0

      - name: Validate deployment source
        shell: bash
        run: |
          if [[ "$DEPLOYMENT_CHANNEL" != 'stable' && "$DEPLOYMENT_CHANNEL" != 'dev' ]]; then
            echo "The deployment channel must be stable or dev." >&2
            exit 1
          fi
          if [[ "$GITHUB_EVENT_NAME" == 'workflow_dispatch' && "$GITHUB_REF_TYPE" != 'branch' ]]; then
            echo "Run the stable deployment from a branch, not a tag." >&2
            exit 1
          fi

      - name: Set version from source branch
        shell: bash
        env:
          VERSION_BRANCH: ${{ inputs.source_ref || github.ref_name }}
        run: |
          if [[ ! "$VERSION_BRANCH" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "The selected branch must be a version such as 1.0.0." >&2
            exit 1
          fi
          printf '%s\n' "$VERSION_BRANCH" > VERSION

      - name: Configure deployment channel
        id: meta
        shell: bash
        run: |
          case "$DEPLOYMENT_CHANNEL" in
            stable)
              echo "environment=production" >> "$GITHUB_OUTPUT"
              echo "url=https://shroudedit.com" >> "$GITHUB_OUTPUT"
              ;;
            dev)
              echo "environment=dev" >> "$GITHUB_OUTPUT"
              echo "url=https://dev.shroudedit.com" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "The deployment channel must be stable or dev." >&2
              exit 1
              ;;
          esac

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Enable Corepack
        run: corepack enable

      - name: Inject build variables
        working-directory: ./apps/frontend
        env:
          DEPLOYMENT_CHANNEL: ${{ inputs.channel || 'stable' }}
        run: |
          if [[ "$DEPLOYMENT_CHANNEL" == 'dev' ]]; then
            jq -r '.env.dev.vars | to_entries[] | "\(.key)=\(.value)"' wrangler.jsonc >> "$GITHUB_ENV"
          else
            jq -r '.vars | to_entries[] | "\(.key)=\(.value)"' wrangler.jsonc >> "$GITHUB_ENV"
          fi

      - name: Install dependencies
        working-directory: ./apps/frontend
        run: pnpm install

      - name: Build frontend
        run: pnpm web:build
        env:
          CF_PAGES_BRANCH: ${{ inputs.source_ref || github.ref_name }}
          CF_PAGES_COMMIT_SHA: ${{ inputs.source_sha || github.sha }}
          CF_PAGES_URL: ${{ steps.meta.outputs.url }}
          BUILD_ENV: ${{ steps.meta.outputs.environment }}
          PREVIEW: 'false'
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

      - name: Confirm the selected branch is still current
        id: current
        shell: bash
        run: |
          git fetch --no-tags origin "refs/heads/$DEPLOY_SOURCE_REF"
          current_sha="$(git rev-parse FETCH_HEAD)"
          if [[ "$current_sha" == "$DEPLOY_SHA" ]]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::The selected branch changed during the build. Skipping this older deployment."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Sentry release and upload sourcemaps
        if: steps.current.outputs.deploy == 'true'
        uses: getsentry/action-release@ff07929a6537bac57790c3451cf4d364aca38528 # v3.7.0
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: shroudedit
          SENTRY_PROJECT: knossos-server
        with:
          environment: ${{ steps.meta.outputs.environment }}
          sourcemaps: ./apps/frontend/.output/server
          url_prefix: '~/'

      - name: Install Wrangler CLI
        if: steps.current.outputs.deploy == 'true'
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          workingDirectory: ./apps/frontend
          packageManager: pnpm
          wranglerVersion: '4.112.0'
          command: --version

      - name: Deploy Cloudflare Worker
        if: steps.current.outputs.deploy == 'true'
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          environment: ${{ inputs.channel == 'dev' && 'dev' || '' }}
          workingDirectory: ./apps/frontend
          command: deploy

      - name: Purge dev cache
        if: env.DEPLOYMENT_CHANNEL == 'dev' && steps.current.outputs.deploy == 'true'
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          curl -X POST \
            -H "Authorization: Bearer $CF_API_TOKEN" \
            -H "Content-Type: application/json" \
            --data '{"hosts": ["dev.shroudedit.com"]}' \
            https://api.cloudflare.com/client/v4/zones/e39df17b9c4ef44cbce2646346ee6d33/purge_cache

      - name: Purge stable cache
        if: env.DEPLOYMENT_CHANNEL == 'stable' && steps.current.outputs.deploy == 'true'
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          curl -X POST \
            -H "Authorization: Bearer $CF_API_TOKEN" \
            -H "Content-Type: application/json" \
            --data '{"hosts": ["shroudedit.com", "www.shroudedit.com"]}' \
            https://api.cloudflare.com/client/v4/zones/e39df17b9c4ef44cbce2646346ee6d33/purge_cache

      - name: Record deployed source
        if: steps.current.outputs.deploy == 'true'
        env:
          WEBSITE_URL: ${{ steps.meta.outputs.url }}
        run: |
          DEPLOY_VERSION="$(cat VERSION)"
          printf 'Website: %s\n\nChannel: `%s`\n\nVersion: `%s`\n\nBranch: `%s`\n\nCommit: `%s`\n' \
            "$WEBSITE_URL" "$DEPLOYMENT_CHANNEL" "$DEPLOY_VERSION" "$DEPLOY_SOURCE_REF" "$DEPLOY_SHA" >> "$GITHUB_STEP_SUMMARY"
