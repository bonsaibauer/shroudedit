name: Publish frontend container

on:
  pull_request:
    branches: [dev, prod]
    types: [closed]
    paths:
      - 'apps/frontend/**/*'
      - 'packages/ui/**/*'
      - 'packages/utils/**/*'
      - 'packages/assets/**/*'
      - 'packages/moderation/**/*'
      - 'packages/api-client/**/*'
      - 'packages/blog/**/*'
      - '**/pnpm-*.yaml'
      - '.github/actions/validate-deployment-pr/**'
      - '.github/actions/deployment-number/**'
      - .github/workflows/frontend-docker.yml

permissions:
  contents: read

jobs:
  build:
    name: Build frontend container context
    if: >-
      ${{
        github.event.pull_request.merged == true
        && github.event.pull_request.head.repo.full_name == github.repository
      }}
    runs-on: namespace-profile-shroudedit-frontend
    permissions:
      contents: read
      pull-requests: read
    outputs:
      environment: ${{ steps.meta.outputs.environment }}
      version: ${{ steps.meta.outputs.version }}
      deployment_number: ${{ steps.meta.outputs.deployment_number }}
      short_sha: ${{ steps.meta.outputs.short_sha }}
    env:
      SOURCE_BRANCH: ${{ github.event.pull_request.head.ref }}
      TARGET_BRANCH: ${{ github.event.pull_request.base.ref }}
      DEPLOY_SHA: ${{ github.event.pull_request.merge_commit_sha }}
    steps:
      - name: Checkout merged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0

      - name: Validate deployment PR
        uses: ./.github/actions/validate-deployment-pr
        with:
          source-branch: ${{ github.event.pull_request.head.ref }}
          source-sha: ${{ github.event.pull_request.head.sha }}
          source-repository: ${{ github.event.pull_request.head.repo.full_name }}
          target-branch: ${{ github.event.pull_request.base.ref }}
          repository: ${{ github.repository }}
          api-url: ${{ github.api_url }}
          github-token: ${{ github.token }}

      - name: Determine deployment number
        id: deployment-number
        uses: ./.github/actions/deployment-number
        with:
          source-branch: ${{ github.event.pull_request.head.ref }}
          target-branch: ${{ github.event.pull_request.base.ref }}
          pull-request-number: ${{ github.event.pull_request.number }}
          merged-at: ${{ github.event.pull_request.merged_at }}
          repository: ${{ github.repository }}
          api-url: ${{ github.api_url }}
          github-token: ${{ github.token }}

      - name: Configure deployment version
        id: meta
        shell: bash
        env:
          DEPLOYMENT_NUMBER: ${{ steps.deployment-number.outputs.deployment-number }}
        run: |
          if [[ ! "$SOURCE_BRANCH" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "PR source branch must be a version such as 1.0.0; received: $SOURCE_BRANCH" >&2
            exit 1
          fi

          case "$TARGET_BRANCH" in
            dev) environment=dev ;;
            prod) environment=production ;;
            *) echo "Unsupported deployment target: $TARGET_BRANCH" >&2; exit 1 ;;
          esac

          echo "environment=$environment" >> "$GITHUB_OUTPUT"
          echo "version=$SOURCE_BRANCH" >> "$GITHUB_OUTPUT"
          echo "deployment_number=$DEPLOYMENT_NUMBER" >> "$GITHUB_OUTPUT"
          echo "short_sha=${DEPLOY_SHA:0:12}" >> "$GITHUB_OUTPUT"

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Enable Corepack
        run: corepack enable

      - name: Set up caches
        uses: namespacelabs/nscloud-cache-action@c5f8dab7560444c4bf8dbc64f1b203431873c547 # v1.6.1
        with:
          cache: pnpm

      - name: Inject build variables
        working-directory: ./apps/frontend
        env:
          ENVIRONMENT: ${{ steps.meta.outputs.environment }}
        run: |
          if [ "$ENVIRONMENT" = "dev" ]; then
            jq -r '.env.dev.vars | to_entries[] | "\(.key)=\(.value)"' wrangler.jsonc >> "$GITHUB_ENV"
          else
            jq -r '.vars | to_entries[] | "\(.key)=\(.value)"' wrangler.jsonc >> "$GITHUB_ENV"
          fi

      - name: Install dependencies
        working-directory: ./apps/frontend
        run: pnpm install

      - name: Build frontend
        run: pnpm web:build
        env:
          NITRO_PRESET: node_cluster
          BUILD_ENV: ${{ steps.meta.outputs.environment }}
          CF_PAGES_BRANCH: ${{ github.event.pull_request.head.ref }}
          CF_PAGES_COMMIT_SHA: ${{ github.event.pull_request.merge_commit_sha }}

      - name: Stage Docker context
        run: |
          mkdir -p apps/frontend/docker-stage
          cp -r apps/frontend/.output apps/frontend/docker-stage/.output

      - name: Upload Docker context
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-docker-context
          retention-days: 1
          path: apps/frontend/docker-stage
          include-hidden-files: true

  publish:
    name: Publish frontend container
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.tags.outputs.image }}
      version_tag: ${{ steps.tags.outputs.version_tag }}
      target: ${{ steps.tags.outputs.target }}
    env:
      IMAGE_OWNER: ${{ github.repository_owner }}
      IMAGE_NAME: shroudedit-frontend
      ENVIRONMENT: ${{ needs.build.outputs.environment }}
      VERSION: ${{ needs.build.outputs.version }}
      DEPLOYMENT_NUMBER: ${{ needs.build.outputs.deployment_number }}
      SHORT_SHA: ${{ needs.build.outputs.short_sha }}
    steps:
      - name: Checkout merged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - name: Download Docker context
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: frontend-docker-context
          path: apps/frontend/docker-stage

      - name: Configure image tags
        id: tags
        run: |
          target="$ENVIRONMENT"
          if [ "$target" = "production" ]; then
            target=prod
          fi

          image="ghcr.io/$(printf '%s' "$IMAGE_OWNER" | tr '[:upper:]' '[:lower:]')/$IMAGE_NAME"
          version_tag="v${VERSION}-${target}.${DEPLOYMENT_NUMBER}"
          immutable_tag="${version_tag}-sha.${SHORT_SHA}"

          {
            echo "image=$image"
            echo "version_tag=$version_tag"
            echo "immutable_tag=$immutable_tag"
            echo "target=$target"
          } >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Build and publish frontend image
        env:
          IMAGE: ${{ steps.tags.outputs.image }}
          VERSION_TAG: ${{ steps.tags.outputs.version_tag }}
          IMMUTABLE_TAG: ${{ steps.tags.outputs.immutable_tag }}
          TARGET: ${{ steps.tags.outputs.target }}
        run: |
          docker build \
            --file apps/frontend/Dockerfile \
            --tag "$IMAGE:$VERSION_TAG" \
            --tag "$IMAGE:$IMMUTABLE_TAG" \
            apps/frontend/docker-stage

          docker push "$IMAGE:$VERSION_TAG"
          docker push "$IMAGE:$IMMUTABLE_TAG"

  promote-latest:
    name: Move ${{ github.event.pull_request.base.ref }} frontend alias
    needs: [publish]
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-${{ github.event.pull_request.base.ref }}-alias
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    env:
      TARGET_BRANCH: ${{ github.event.pull_request.base.ref }}
      DEPLOY_SHA: ${{ github.event.pull_request.merge_commit_sha }}
      IMAGE: ${{ needs.publish.outputs.image }}
      VERSION_TAG: ${{ needs.publish.outputs.version_tag }}
      TARGET: ${{ needs.publish.outputs.target }}
    steps:
      - name: Check out deployment commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0

      - name: Check whether this is still the latest frontend content
        id: current
        run: |
          git fetch origin "$TARGET_BRANCH"
          if git diff --quiet "$DEPLOY_SHA" FETCH_HEAD -- \
            apps/frontend \
            packages/ui \
            packages/utils \
            packages/assets \
            packages/moderation \
            packages/api-client \
            packages/blog \
            '**/pnpm-*.yaml' \
            '**/wrangler.jsonc'; then
            echo "is_current=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_current=false" >> "$GITHUB_OUTPUT"
            echo "Skipping alias update because newer frontend content is already on $TARGET_BRANCH"
          fi

      - name: Log in to GitHub Container Registry
        if: steps.current.outputs.is_current == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Move frontend alias
        if: steps.current.outputs.is_current == 'true'
        run: |
          if [ "$TARGET" = "prod" ]; then
            alias=latest
          else
            alias=dev-latest
          fi

          docker pull "$IMAGE:$VERSION_TAG"
          docker tag "$IMAGE:$VERSION_TAG" "$IMAGE:$alias"
          docker push "$IMAGE:$alias"
