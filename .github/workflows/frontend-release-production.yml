name: Release frontend to production

on:
  pull_request:
    branches: [prod]
    types: [closed]
    paths:
      - 'apps/frontend/**/*'
      - 'packages/ui/**/*'
      - 'packages/utils/**/*'
      - 'packages/assets/**/*'
      - 'packages/moderation/**/*'
      - 'packages/api-client/**/*'
      - 'packages/blog/**/*'
      - '**/wrangler.jsonc'
      - '**/pnpm-*.yaml'
      - 'package.json'
      - 'turbo.jsonc'
      - '.github/actions/validate-deployment-pr/**'
      - '.github/workflows/frontend-deploy.yml'
      - '.github/workflows/frontend-release-production.yml'

permissions:
  contents: read
  deployments: write
  pull-requests: write

jobs:
  release:
    if: >-
      ${{
        github.event.pull_request.merged == true
        && github.event.pull_request.head.repo.full_name == github.repository
      }}
    uses: ./.github/workflows/frontend-deploy.yml
    secrets: inherit
