name: Labrinth Build and Publish
run-name: ${{ github.event_name == 'workflow_dispatch' && format('Publish API stable from {0}', github.ref_name) || github.event_name == 'push' && format('Publish API dev from {0}', github.ref_name) || github.event_name == 'pull_request' && format('Build API for PR #{0}', github.event.pull_request.number) || format('Build API for {0}', github.ref_name) }}

on:
  push:
    branches:
      - '*.*.*'
    paths:
      - .github/workflows/labrinth-build.yml
      - VERSION
      - 'apps/labrinth/**'
      - 'packages/**'
      - '!packages/api-client/**'
      - Cargo.toml
      - Cargo.lock
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/labrinth-build.yml
      - VERSION
      - 'apps/labrinth/**'
      - 'packages/**'
      - '!packages/api-client/**'
      - Cargo.toml
      - Cargo.lock
  workflow_dispatch:
  merge_group:
    types: [checks_requested]

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && 'stable' || github.event_name == 'push' && 'dev' || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  skip-if-clean:
    name: Skip if merge_queue produces no diff
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.check.outputs.skip }}
      internal: ${{ steps.check-internal.outputs.internal }}
    if: ${{ always() }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check if workflow runs on an internal branch
        id: check-internal
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPO: ${{ github.repository }}
        run: |
          if [ "$EVENT_NAME" != "pull_request" ] || [ "$HEAD_REPO" = "$REPO" ]; then
            echo "internal=true" >> $GITHUB_OUTPUT
          else
            echo "internal=false" >> $GITHUB_OUTPUT
          fi

      - name: Merge Queue CI Check Skipper
        if: github.event_name == 'merge_group'
        id: merge-queue-ci-skipper
        uses: ./.github/merge-queue-ci-skipper
        with:
          secret: ${{ secrets.GH_ACCESS_TOKEN }}

      - name: Check merge_group synthetic commit
        id: check
        run: |
          # PR mode: never skip
          if [ "${{ github.event_name }}" != "merge_group" ]; then
            echo "skip=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          if [ "${{ steps.merge-queue-ci-skipper.outputs.skip-check }}" = "true" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

  build:
    name: Build Labrinth
    runs-on: ${{ needs.skip-if-clean.outputs.internal == 'true' && 'namespace-profile-shroudedit-labrinth' || 'ubuntu-latest' }}
    needs: [skip-if-clean]
    if: needs.skip-if-clean.outputs.skip != 'true'
    env:
      SQLX_OFFLINE: 'true'
      GIT_HASH: ${{ github.sha }}
      SCCACHE_CACHE_SIZE: ${{ needs.skip-if-clean.outputs.internal == 'true' && '20G' || '' }}
      RUSTC_WRAPPER: ${{ needs.skip-if-clean.outputs.internal == 'true' && 'sccache' || '' }}
      RUST_MIN_STACK: '268435456'
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Require a branch for API publication
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" != 'branch' ]]; then
            echo "Run this workflow from a branch, not a tag." >&2
            exit 1
          fi

      - name: Set version from source branch
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
        shell: bash
        env:
          VERSION_BRANCH: ${{ github.ref_name }}
        run: |
          if [[ ! "$VERSION_BRANCH" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "The selected branch must be a version such as 1.0.0." >&2
            exit 1
          fi
          printf '%s\n' "$VERSION_BRANCH" > VERSION

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          rustflags: ''
          cache: false

      - name: Setup mold
        uses: rui314/setup-mold@9c9c13bf4c3f1adef0cc596abc155580bcb04444 # v1 / Mold 2.41.0

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10

      - name: Set up caches
        if: needs.skip-if-clean.outputs.internal == 'true'
        uses: namespacelabs/nscloud-cache-action@c5f8dab7560444c4bf8dbc64f1b203431873c547 # v1.6.1
        with:
          cache: |
            rust
            apt

      - name: Configure sccache
        if: needs.skip-if-clean.outputs.internal == 'true'
        run: nsc cache sccache setup --cache_name default >> "$GITHUB_ENV"

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cmake libcurl4-openssl-dev

      - name: Build labrinth
        run: cargo build --profile release-labrinth --package labrinth

      - name: Stage Docker context
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
        run: |
          mkdir -p apps/labrinth/docker-stage
          cp target/release-labrinth/labrinth apps/labrinth/docker-stage/labrinth
          cp -r apps/labrinth/migrations apps/labrinth/docker-stage/migrations
          cp -r apps/labrinth/assets apps/labrinth/docker-stage/assets
          cp VERSION apps/labrinth/docker-stage/VERSION

      - name: Upload Docker context
        if: ${{ needs.skip-if-clean.outputs.internal == 'true' && (github.event_name == 'workflow_dispatch' || github.event_name == 'push') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: labrinth-docker-context
          retention-days: 1
          path: apps/labrinth/docker-stage

  publish-image:
    name: Publish ${{ github.event_name == 'workflow_dispatch' && 'stable' || 'dev' }} API image
    needs: [skip-if-clean, build]
    if: >-
      ${{
        needs.skip-if-clean.outputs.internal == 'true'
        && (github.event_name == 'workflow_dispatch' || github.event_name == 'push')
      }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.tags.outputs.image }}
      version_tag: ${{ steps.tags.outputs.version_tag }}
      channel: ${{ steps.tags.outputs.channel }}
    env:
      DEPLOYMENT_CHANNEL: ${{ github.event_name == 'workflow_dispatch' && 'stable' || 'dev' }}
      IMAGE_OWNER: ${{ github.repository_owner }}
      IMAGE_NAME: shroudedit-api
      DEPLOY_SHA: ${{ github.sha }}
    steps:
      - name: Check out selected source commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Download Docker context
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: labrinth-docker-context
          path: apps/labrinth/docker-stage

      - name: Prepare image tags
        id: tags
        shell: bash
        env:
          DEPLOYMENT_CHANNEL: ${{ github.event_name == 'workflow_dispatch' && 'stable' || 'dev' }}
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          case "$DEPLOYMENT_CHANNEL" in
            stable|dev) ;;
            *) echo "Unsupported API channel: $DEPLOYMENT_CHANNEL" >&2; exit 1 ;;
          esac

          short_sha="${DEPLOY_SHA:0:12}"
          version_tag="${DEPLOYMENT_CHANNEL}-${GITHUB_RUN_NUMBER}"
          immutable_tag="${DEPLOYMENT_CHANNEL}-sha.${short_sha}"
          image="ghcr.io/$(printf '%s' "$IMAGE_OWNER" | tr '[:upper:]' '[:lower:]')/$IMAGE_NAME"

          {
            echo "channel=$DEPLOYMENT_CHANNEL"
            echo "version_tag=$version_tag"
            echo "immutable_tag=$immutable_tag"
            echo "image=$image"
          } >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Build and publish API image
        env:
          IMAGE: ${{ steps.tags.outputs.image }}
          VERSION_TAG: ${{ steps.tags.outputs.version_tag }}
          IMMUTABLE_TAG: ${{ steps.tags.outputs.immutable_tag }}
        run: |
          BUILD_VERSION="$(cat apps/labrinth/docker-stage/VERSION)"
          docker build \
            --build-arg BUILD_VERSION="$BUILD_VERSION" \
            --file apps/labrinth/Dockerfile \
            --tag "$IMAGE:$VERSION_TAG" \
            --tag "$IMAGE:$IMMUTABLE_TAG" \
            apps/labrinth/docker-stage

          docker push "$IMAGE:$VERSION_TAG"
          docker push "$IMAGE:$IMMUTABLE_TAG"

  promote-channel-aliases:
    name: Update ${{ github.event_name == 'workflow_dispatch' && 'stable' || 'dev' }} API aliases
    needs: [publish-image]
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && 'stable' || 'dev' }}-alias
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    env:
      SOURCE_BRANCH_REF: ${{ github.ref_name }}
      SOURCE_BRANCH_SHA: ${{ github.sha }}
      IMAGE: ${{ needs.publish-image.outputs.image }}
      VERSION_TAG: ${{ needs.publish-image.outputs.version_tag }}
      CHANNEL: ${{ needs.publish-image.outputs.channel }}
    steps:
      - name: Check out deployment commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Confirm the selected branch is still current
        id: current
        shell: bash
        run: |
          git fetch --no-tags origin "refs/heads/$SOURCE_BRANCH_REF"
          current_sha="$(git rev-parse FETCH_HEAD)"
          if [[ "$current_sha" == "$SOURCE_BRANCH_SHA" ]]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::The selected branch changed during the build. Skipping this older deployment."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to GitHub Container Registry
        if: steps.current.outputs.deploy == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Update API channel aliases
        if: steps.current.outputs.deploy == 'true'
        run: |
          case "$CHANNEL" in
            stable) aliases=(stable latest) ;;
            dev) aliases=(dev dev-latest) ;;
            *) echo "Unsupported API channel: $CHANNEL" >&2; exit 1 ;;
          esac
          docker pull "$IMAGE:$VERSION_TAG"
          for alias in "${aliases[@]}"; do
            docker tag "$IMAGE:$VERSION_TAG" "$IMAGE:$alias"
            docker push "$IMAGE:$alias"
          done
