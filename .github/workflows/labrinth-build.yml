name: Labrinth Build

on:
  pull_request:
    branches: [dev, prod]
    types: [opened, synchronize, reopened, closed]
    paths:
      - .github/workflows/labrinth-build.yml
      - .github/actions/validate-deployment-pr/**
      - 'apps/labrinth/**'
      - 'packages/**'
      - '!packages/api-client/**'
      - Cargo.toml
      - Cargo.lock
  merge_group:
    types: [checks_requested]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.event.action != 'closed' }}

permissions:
  contents: read

jobs:
  skip-if-clean:
    name: Skip if merge_queue produces no diff
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.check.outputs.skip }}
      internal: ${{ steps.check-internal.outputs.internal }}
    if: ${{ always() }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check if workflow runs on an internal branch
        id: check-internal
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPO: ${{ github.repository }}
        run: |
          if [ "$EVENT_NAME" != "pull_request" ] || [ "$HEAD_REPO" = "$REPO" ]; then
            echo "internal=true" >> $GITHUB_OUTPUT
          else
            echo "internal=false" >> $GITHUB_OUTPUT
          fi

      - name: Merge Queue CI Check Skipper
        id: merge-queue-ci-skipper
        uses: ./.github/merge-queue-ci-skipper
        with:
          secret: ${{ secrets.GH_ACCESS_TOKEN }}

      - name: Check merge_group synthetic commit
        id: check
        run: |
          # PR mode: never skip
          if [ "${{ github.event_name }}" != "merge_group" ]; then
            echo "skip=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          if [ "${{ steps.merge-queue-ci-skipper.outputs.skip-check }}" = "true" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

  build:
    name: Build Labrinth
    runs-on: ${{ needs.skip-if-clean.outputs.internal == 'true' && 'namespace-profile-shroudedit-labrinth' || 'ubuntu-latest' }}
    needs: [skip-if-clean]
    if: >-
      ${{
        needs.skip-if-clean.outputs.skip != 'true'
        && (github.event.action != 'closed' || github.event.pull_request.merged == true)
      }}
    env:
      SQLX_OFFLINE: 'true'
      GIT_HASH: ${{ github.event.action == 'closed' && github.event.pull_request.merged && github.event.pull_request.merge_commit_sha || github.sha }}
      SCCACHE_CACHE_SIZE: ${{ needs.skip-if-clean.outputs.internal == 'true' && '20G' || '' }}
      RUSTC_WRAPPER: ${{ needs.skip-if-clean.outputs.internal == 'true' && 'sccache' || '' }}
      RUST_MIN_STACK: '268435456'
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.action == 'closed' && github.event.pull_request.merged && github.event.pull_request.merge_commit_sha || github.sha }}

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          rustflags: ''
          cache: false

      - name: Setup mold
        uses: rui314/setup-mold@9c9c13bf4c3f1adef0cc596abc155580bcb04444 # v1 / Mold 2.41.0

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10

      - name: Set up caches
        if: needs.skip-if-clean.outputs.internal == 'true'
        uses: namespacelabs/nscloud-cache-action@c5f8dab7560444c4bf8dbc64f1b203431873c547 # v1.6.1
        with:
          cache: |
            rust
            apt

      - name: Configure sccache
        if: needs.skip-if-clean.outputs.internal == 'true'
        run: nsc cache sccache setup --cache_name default >> "$GITHUB_ENV"

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cmake libcurl4-openssl-dev

      - name: Build labrinth
        run: cargo build --profile release-labrinth --package labrinth

      - name: Stage Docker context
        run: |
          mkdir -p apps/labrinth/docker-stage
          cp target/release-labrinth/labrinth apps/labrinth/docker-stage/labrinth
          cp -r apps/labrinth/migrations apps/labrinth/docker-stage/migrations
          cp -r apps/labrinth/assets apps/labrinth/docker-stage/assets

      - name: Upload Docker context
        if: >-
          ${{
            needs.skip-if-clean.outputs.internal == 'true'
            && github.event_name == 'pull_request'
            && github.event.action == 'closed'
            && github.event.pull_request.merged == true
          }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: labrinth-docker-context
          retention-days: 1
          path: apps/labrinth/docker-stage

  publish-image:
    name: Publish ${{ github.event.pull_request.base.ref }} API image
    needs: [skip-if-clean, build]
    if: >-
      ${{
        needs.skip-if-clean.outputs.internal == 'true'
        && github.event_name == 'pull_request'
        && github.event.action == 'closed'
        && github.event.pull_request.merged == true
      }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      pull-requests: read
    outputs:
      image: ${{ steps.tags.outputs.image }}
      version_tag: ${{ steps.tags.outputs.version_tag }}
      environment: ${{ steps.tags.outputs.environment }}
    env:
      SOURCE_BRANCH: ${{ github.event.pull_request.head.ref }}
      TARGET_BRANCH: ${{ github.event.pull_request.base.ref }}
      IMAGE_OWNER: ${{ github.repository_owner }}
      IMAGE_NAME: shroudedit-api
      DEPLOY_SHA: ${{ github.event.pull_request.merge_commit_sha }}
    steps:
      - name: Check out merged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0

      - name: Validate deployment PR
        uses: ./.github/actions/validate-deployment-pr
        with:
          source-branch: ${{ github.event.pull_request.head.ref }}
          source-sha: ${{ github.event.pull_request.head.sha }}
          source-repository: ${{ github.event.pull_request.head.repo.full_name }}
          target-branch: ${{ github.event.pull_request.base.ref }}
          repository: ${{ github.repository }}
          api-url: ${{ github.api_url }}
          github-token: ${{ github.token }}

      - name: Download Docker context
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: labrinth-docker-context
          path: apps/labrinth/docker-stage

      - name: Prepare image tags
        id: tags
        shell: bash
        run: |
          if [[ ! "$SOURCE_BRANCH" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "PR source branch must be a version such as 1.0.0; received: $SOURCE_BRANCH" >&2
            exit 1
          fi

          case "$TARGET_BRANCH" in
            dev) environment=dev ;;
            prod) environment=prod ;;
            *) echo "Unsupported deployment target: $TARGET_BRANCH" >&2; exit 1 ;;
          esac

          short_sha="${DEPLOY_SHA:0:12}"
          deployment_number="$(git rev-list --first-parent --count "$DEPLOY_SHA")"
          version_tag="v${SOURCE_BRANCH}-${environment}.${deployment_number}"
          immutable_tag="${version_tag}-sha.${short_sha}"
          image="ghcr.io/$(printf '%s' "$IMAGE_OWNER" | tr '[:upper:]' '[:lower:]')/$IMAGE_NAME"

          {
            echo "environment=$environment"
            echo "deployment_number=$deployment_number"
            echo "version_tag=$version_tag"
            echo "immutable_tag=$immutable_tag"
            echo "image=$image"
          } >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Build and publish API image
        env:
          IMAGE: ${{ steps.tags.outputs.image }}
          VERSION_TAG: ${{ steps.tags.outputs.version_tag }}
          IMMUTABLE_TAG: ${{ steps.tags.outputs.immutable_tag }}
          ENVIRONMENT: ${{ steps.tags.outputs.environment }}
        run: |
          docker build \
            --file apps/labrinth/Dockerfile \
            --tag "$IMAGE:$VERSION_TAG" \
            --tag "$IMAGE:$IMMUTABLE_TAG" \
            apps/labrinth/docker-stage

          docker push "$IMAGE:$VERSION_TAG"
          docker push "$IMAGE:$IMMUTABLE_TAG"

  promote-latest:
    name: Move ${{ github.event.pull_request.base.ref }} API alias
    needs: [publish-image]
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-${{ github.event.pull_request.base.ref }}-alias
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    env:
      TARGET_BRANCH: ${{ github.event.pull_request.base.ref }}
      DEPLOY_SHA: ${{ github.event.pull_request.merge_commit_sha }}
      IMAGE: ${{ needs.publish-image.outputs.image }}
      VERSION_TAG: ${{ needs.publish-image.outputs.version_tag }}
      ENVIRONMENT: ${{ needs.publish-image.outputs.environment }}
    steps:
      - name: Check out deployment commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0

      - name: Check whether this is still the latest API content
        id: current
        run: |
          git fetch origin "$TARGET_BRANCH"
          if git diff --quiet "$DEPLOY_SHA" FETCH_HEAD -- \
            apps/labrinth \
            Cargo.toml \
            Cargo.lock \
            packages \
            ':(exclude)packages/api-client/**'; then
            echo "is_current=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_current=false" >> "$GITHUB_OUTPUT"
            echo "Skipping alias update because newer API content is already on $TARGET_BRANCH"
          fi

      - name: Log in to GitHub Container Registry
        if: steps.current.outputs.is_current == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Move API alias
        if: steps.current.outputs.is_current == 'true'
        run: |
          if [ "$ENVIRONMENT" = "prod" ]; then
            alias=latest
          else
            alias=dev-latest
          fi

          docker pull "$IMAGE:$VERSION_TAG"
          docker tag "$IMAGE:$VERSION_TAG" "$IMAGE:$alias"
          docker push "$IMAGE:$alias"
