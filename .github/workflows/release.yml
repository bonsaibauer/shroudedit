name: Publish stable ShroudEdit release

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Version branch to release (must match VERSION)
        required: true

jobs:
  release:
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/checkout@v4
        with:
          repository: bonsaibauer/shroudtopia
          ref: 1.1.0
          path: _deps/shroudtopia
          submodules: recursive
      - name: Validate version
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          if ("${{ inputs.ref }}" -ne $version) { throw "Release ref must match VERSION '$version'." }
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Build, test and package
        shell: pwsh
        run: .\build.ps1 -BuildNumber "${{ github.run_number }}" -ShroudtopiaDirectory "${{ github.workspace }}/_deps/shroudtopia" -RefName "${{ inputs.ref }}" -RefType branch
      - name: Publish stable release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: |
            build/shroudedit-*.zip
            build/shroudedit-*.zip.sha256
          generate_release_notes: true
